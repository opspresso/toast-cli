name: CI

# Runs before every release (called by release.yml) and on demand. Pull requests and pushes do not
# start it: the tag release is the single gate before a package is published.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # tests/test_shell_init.py runs bash and zsh, and fails in CI when one is missing.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: command -v zsh || { sudo apt-get update && sudo apt-get install -y zsh; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests
